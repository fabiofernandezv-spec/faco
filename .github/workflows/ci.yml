name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Stubs de Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stubs.sql
      - name: Esquema (dos veces, debe ser idempotente)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Pruebas de comportamiento del rundown
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rundown_behavior.sql
